{% extends 'base.html' %}{% block content %}<h1>My Wishlist ♡</h1><div class="grid">{% for p in products %}<article class="card"><div class="placeholder">🛍️</div><h3>{{p.name}}</h3><b>₹{{p.sale_price|floatformat:0}}</b><a class="btn small" href="/cart/add/{{p.id}}/">Add to Cart</a><a href="/wishlist/toggle/{{p.id}}/">Remove</a></article>{% empty %}<p>Your wishlist is empty.</p>{% endfor %}</div>{% endblock %}
