{% extends 'base.html' %}{% block content %}<div class="checkout"><div><h1>Checkout</h1><form method="post">{% csrf_token %}<input name="full_name" placeholder="Full Name" required><textarea name="address" placeholder="Delivery Address" required></textarea><input name="city" placeholder="City" required><input name="pincode" placeholder="PIN Code" required><input name="mobile" placeholder="Mobile Number" required><select name="payment_method"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><button class="btn">Place Order</button></form></div><div class="summary"><h2>Order Total</h2><h1>₹{{total|floatformat:0}}</h1></div></div>{% endblock %}
